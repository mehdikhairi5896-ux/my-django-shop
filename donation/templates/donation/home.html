{% extends "base.html" %}

{% block content %}

<div class="donation-box">

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>نام کمک‌کننده</label>
            {{ form.donor_name }}
        </div>

        <div class="form-group">
            <label>مبلغ کمک</label>
            {{ form.amount }}
        </div>

        <div class="form-group">
            <label>توضیحات</label>
            {{ form.description }}
        </div>

        <button type="submit" class="donate-btn">
            🤲 ثبت کمک
        </button>

    </form>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const amountInput = document.getElementById("id_amount");

    if (!amountInput) return;

    function formatAmount(value) {
        value = value.replace(/[^\d]/g, "");
        if (!value) return "";
        return Number(value).toLocaleString("en-US");
    }

    amountInput.addEventListener("input", function () {
        this.value = formatAmount(this.value);
    });

    amountInput.value = formatAmount(amountInput.value);

    amountInput.form.addEventListener("submit", function () {
        amountInput.value = amountInput.value.replace(/,/g, "");
    });

});
</script>

{% endblock %}
