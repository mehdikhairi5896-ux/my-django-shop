<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت تبلیغ جدید</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#e3f2fd,#fff3e0);
            color: #222;
        }

        .ad-form-box {
            max-width: 700px;
            margin: 20px auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 18px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 17px;
            font-family: inherit;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        input[type="file"] {
            padding: 10px;
            background: #fff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #0b5ed7;
        }
    </style>
</head>

<body>

<div class="ad-form-box">

    <h2>📢 ثبت تبلیغ جدید</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="field">
            <label for="{{ form.title.id_for_label }}">عنوان تبلیغ</label>
            {{ form.title }}
        </div>

        <div class="field">
            <label for="{{ form.description.id_for_label }}">توضیحات</label>
            {{ form.description }}
        </div>

        <div class="field">
            <label for="{{ form.city.id_for_label }}">شهر</label>
            {{ form.city }}
        </div>

        <div class="field">
            <label for="{{ form.image.id_for_label }}">تصویر</label>
            {{ form.image }}
        </div>

        <div class="field">
            <label for="{{ form.duration.id_for_label }}">مدت نمایش</label>
            {{ form.duration }}
        </div>

        <button type="submit" class="submit-btn">
    {% if form.instance.pk %}
        💾 ذخیره تغییرات
    {% else %}
        📢 ثبت تبلیغ
    {% endif %}
</button>

    </form>

</div>

</body>
</html>
