<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لیست تبلیغات</title>

<style>
body{
    font-family:tahoma;
    background:linear-gradient(135deg,#e3f2fd,#fff3e0);
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

.ads{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    width:320px;
max-width:100%;
    background:linear-gradient(180deg,#ffffff,#eaf4ff);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
    border:2px solid #0d6efd;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card h3{
    text-align:center;
    color:#198754;
    font-size:20px;
}

.card p{
    padding:0 15px 15px;
    color:#555;
}

.btn{
    display:block;
    width:80%;
    margin:15px auto 20px;
    text-align:center;
    background:#0d6efd;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
}
</style>

</head>

<body>

<h1> 📢 تبلیغات کاربران</h1>

<div class="ads">

{% for ad in ads %}

<div class="card">

{% if ad.image %}
<img src="{{ ad.image.url }}">
{% endif %}

<h3>{{ ad.title }}</h3>

<p>{{ ad.description }}</p>

<a href="{% url 'ad_detail' ad.id %}" class="btn">مشاهده تبلیغ</a>

</div>

{% empty %}

<h2>هنوز تبلیغی ثبت نشده است.</h2>

{% endfor %}

</div>

</body>
</html>
