<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پرداخت سفارش</title>
<style>
    body {
        font-family: Tahoma, sans-serif;
        direction: rtl;
        background: #f5f7fa;
        text-align: center;
        margin: 0;
        padding-top: 70px;
    }

    .payment-box {
        width: 90%;
        max-width: 420px;
        margin: auto;
        background: white;
        padding: 30px 20px;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
        margin-bottom: 25px;
    }

    .order-number {
        color: #555;
        font-size: 17px;
    }

    .price {
        font-size: 22px;
        font-weight: bold;
        margin: 25px 0;
    }

    .pay-button {
        display: inline-block;
        background: #ff9800;
        color: white;
        border: none;
        padding: 13px 30px;
        border-radius: 10px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .back {
        display: inline-block;
        margin-top: 20px;
        color: #555;
        text-decoration: none;
    }

    .error {
        color: #d32f2f;
        background: #ffebee;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
    }
</style>
</head>
<body>

    <div class="payment-box">

        <h1>💳 پرداخت سفارش</h1>

        <p class="order-number">
            شماره سفارش: <strong>{{ order.id }}</strong>
        </p>

        <p class="price">
            مبلغ قابل پرداخت:
            {{ order.total_price }} تومان
        </p>

        {% if error %}
            <div class="error">
                خطا در ایجاد پرداخت:
                {{ error }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="pay-button">
                💳 پرداخت آنلاین
            </button>
        </form>

        <a class="back" href="{% url 'cart_order_detail' order.id %}">
            ↩️ بازگشت به سفارش
        </a>

    </div>

</body>
</html>
