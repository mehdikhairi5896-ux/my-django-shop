<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سفارش‌های من</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f5f5f5;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        .order-box {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            background: #007bff;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h1>📦 سفارش‌های من</h1>

{% if orders %}

    {% for order in orders %}

        <div class="order-box">

            <p>
    <a href="/cart/my-orders/{{ order.id }}/">
        شماره سفارش: {{ order.id }}
    </a>
</p>           

            <p>تاریخ: {{ order.created_at }}</p>

            <p>وضعیت: {{ order.status }}</p>
            
            <p>مبلغ کل: {{ order.total_price }} تومان</p>

        </div>

    {% endfor %}

{% else %}

    <p style="text-align:center;">هیچ سفارشی ثبت نشده است.</p>

{% endif %}

<div style="text-align:center;">
    <a class="back" href="/shop/">
        بازگشت به فروشگاه
    </a>
</div>

</body>
</html>
