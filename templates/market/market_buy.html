{% load humanize %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تأیید خرید {{ item.title }}</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .buy-box {
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        p {
            font-size: 18px;
            margin: 15px 0;
        }

        .price {
            color: #198754;
            font-weight: bold;
        }

        .buy-button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #0d6efd;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="buy-box">

    <h1>🛒 تأیید خرید</h1>

    <h2>{{ item.title }}</h2>

    <p class="price">
        💰 قیمت:
        {{ item.price|intcomma }} تومان
    </p>

    <p>
        📍 شهر: {{ item.city }}
    </p>

    <form method="post">
        {% csrf_token %}

        <button class="buy-button" type="submit">
            ✅ تأیید خرید
        </button>
    </form>

    <a class="back" href="{% url 'market_detail' item.id %}">
        ⬅️ بازگشت
    </a>

</div>

</body>
</html>
