<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>خرید {{ item.title }}</title>
</head>

<body>

<h1>تأیید خرید</h1>

<h2>{{ item.title }}</h2>

<p>
    💰 قیمت:
    {{ item.price }} تومان
</p>

<p>
    📍 شهر: {{ item.city }}
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        ✅ تأیید خرید
    </button>
</form>

<br>

<a href="{% url 'market_detail' item.id %}">
    ⬅ بازگشت
</a>

</body>
</html>
