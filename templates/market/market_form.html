<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>ثبت کالای جدید</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .form-container {
            width: 90%;
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        form p {
            text-align: right;
            margin-bottom: 15px;
        }

        .form-container form {
    width: 100%;
}

.form-container input,
.form-container textarea,
.form-container select {
    display: block;
    width: 100%;
    max-width: 100%;
    min-height: 45px;
    box-sizing: border-box;
    padding: 10px 12px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-family: inherit;
    font-size: 16px;
}

.form-container textarea {
    min-height: 120px;
    resize: vertical;
}

        textarea {
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #0d6efd;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h1>🛒 ثبت کالای جدید</h1>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            ثبت کالا
        </button>

    </form>

    <a class="back" href="{% url 'market_list' %}">
        ⬅️ بازگشت به بازار
    </a>

</div>


<script>
    const priceInput = document.getElementById("id_price");

    if (priceInput) {

        priceInput.addEventListener("input", function () {

            let value = this.value.replace(/,/g, "");

            value = value.replace(/\D/g, "");

            if (value) {
                this.value = Number(value).toLocaleString("en-US");
            }

        });

        priceInput.form.addEventListener("submit", function () {

            priceInput.value = priceInput.value.replace(/,/g, "");

        });

    }
</script>

</body>

</html>
